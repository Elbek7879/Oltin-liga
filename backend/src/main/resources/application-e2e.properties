# Brauzer testlari uchun profil: alohida port, test bazasi, har ishga tushishda toza holat.
# Asosiy (payariq) bazaga hech qachon ulanmaydi.
server.port=${E2E_PORT:18081}
spring.datasource.url=${TEST_DB_URL}
spring.flyway.clean-disabled=false
liga.reset-database=true
liga.demo-data=${E2E_DEMO_DATA:true}
liga.media.dir=target/e2e-uploads
# Brauzer testlarida haqiqiy Telegram'ga ulanilmaydi (asosiy server bilan to'qnashmasligi uchun)
liga.telegram.enabled=false
# Barcha brauzer testlari bitta manzildan (127.0.0.1) keladi — tashriflar chegarasi ularga xalaqit bermasin
liga.visits.max-per-minute=100000
# Ariza va murojaatlar chegarasi ham (ishlab chiqarishda — soatiga 5 va 10 ta)
liga.applications.max-per-hour=100000
liga.feedback.max-per-hour=100000
