spring.application.name=oltin-liga
# Lokal sozlamalar backend/.env faylidan o'qiladi (git ga tushmaydi)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.locations=classpath:db/migration

server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript,application/javascript,application/manifest+json,image/svg+xml
server.compression.min-response-size=2KB
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=POL_SESSION
server.error.include-message=never
server.error.include-stacktrace=never

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

liga.admin.username=${ADMIN_USERNAME:}
liga.admin.password=${ADMIN_PASSWORD:}
liga.admin.display-name=${ADMIN_DISPLAY_NAME:Tashkilotchi}
# Yuklangan rasmlar papkasi (production'da doimiy joy ko'rsatiladi)
liga.media.dir=${MEDIA_DIR:uploads}
liga.demo-data=${DEMO_DATA:false}
# Saytning tashqi manzili (masalan https://oltinliga.uz): canonical, og:url va sitemap shundan olinadi.
# Bo'sh bo'lsa — so'rov kelgan manzildan (lokal ishlab chiqish uchun)
liga.site-url=${SITE_URL:}
# Adminlar uchun Telegram bot (token faqat .env faylida)
liga.telegram.token=${TELEGRAM_BOT_TOKEN:}
liga.telegram.username=${TELEGRAM_BOT_USERNAME:}
liga.telegram.enabled=${TELEGRAM_ENABLED:true}
