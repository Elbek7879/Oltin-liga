# Production profili: java -jar oltin-liga.jar --spring.profiles.active=prod
# Barcha maxfiy qiymatlar muhit o'zgaruvchilaridan yoki server yonidagi .env faylidan olinadi.

# Sayt Nginx/Caddy (HTTPS) ortida ishlaydi: haqiqiy protokol va IP sarlavhalardan olinadi
server.forward-headers-strategy=framework
server.port=${PORT:8080}
# Ilova faqat shu kompyuter ichidan ochiladi, tashqaridan HTTPS proksi orqali
server.address=${SERVER_ADDRESS:127.0.0.1}

# Sessiya cookie faqat HTTPS orqali yuboriladi
server.servlet.session.cookie.secure=true

# Namunaviy ma'lumotlar production'da hech qachon yaratilmaydi
liga.demo-data=false
spring.flyway.clean-disabled=true

logging.file.name=${LOG_FILE:logs/oltin-liga.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO
